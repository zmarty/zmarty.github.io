<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 574" width="640" height="574" role="img" aria-labelledby="title desc">
  <title id="title">Four GPUs connected to an AM5 PCIe switch card with MCIO</title>
  <desc id="desc">A PEX88096 switch connects four RTX PRO 6000 GPUs to an AM5 CPU root complex. Teal message dots travel in both directions between all six GPU pairs along one shared drawing of the switch fabric. Amber dots travel between the CPU and GPU 3 over the same fabric and the CPU uplink. Each GPU link represents two x8 MCIO cables. The animation illustrates routes, not a traced DeepSeek communication schedule. Reduced motion leaves the static connections visible.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { .message { display: none; } }
  </style>
  <rect x="1" y="1" width="638" height="572" rx="16" fill="#f8fafc" stroke="#d3dce6" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172a41">
    <rect x="20" y="20" width="600" height="502" rx="12" fill="#edf5fb" stroke="#a6b8cb" stroke-width="2"/>
    <text x="38" y="47" text-anchor="start" font-size="17" fill="#445b74">Dual-chamber chassis</text>

    <g fill="#fff" stroke="#a6b8cb" stroke-width="2">
      <rect x="46" y="62" width="128" height="62" rx="7"/>
      <rect x="186" y="62" width="128" height="62" rx="7"/>
      <rect x="326" y="62" width="128" height="62" rx="7"/>
      <rect x="466" y="62" width="128" height="62" rx="7"/>
    </g>
    <g font-size="20" font-weight="700">
      <text x="110" y="89">GPU 0</text>
      <text x="250" y="89">GPU 1</text>
      <text x="390" y="89">GPU 2</text>
      <text x="530" y="89">GPU 3</text>
    </g>
    <g font-size="17" fill="#445b74">
      <text x="110" y="111">RTX PRO 6000</text>
      <text x="250" y="111">RTX PRO 6000</text>
      <text x="390" y="111">RTX PRO 6000</text>
      <text x="530" y="111">RTX PRO 6000</text>
    </g>
    <path d="M110 124v17m140-17v17m140-17v17m140-17v17" stroke="#226ca4" stroke-width="4"/>
    <g fill="#d8ebfa" stroke="#a6b8cb" stroke-width="2">
      <rect x="46" y="141" width="128" height="37" rx="7"/>
      <rect x="186" y="141" width="128" height="37" rx="7"/>
      <rect x="326" y="141" width="128" height="37" rx="7"/>
      <rect x="466" y="141" width="128" height="37" rx="7"/>
    </g>
    <g font-size="17">
      <text x="110" y="165">Slot adapter</text>
      <text x="250" y="165">Slot adapter</text>
      <text x="390" y="165">Slot adapter</text>
      <text x="530" y="165">Slot adapter</text>
    </g>


    <text x="320" y="214" font-size="16" font-weight="600">Gen4 x16 / GPU</text>
    <text x="320" y="235" font-size="15" fill="#445b74">2 × x8 MCIO</text>

    <rect x="42" y="261" width="556" height="116" rx="8" fill="#d8ebfa" stroke="#8bb7d8" stroke-width="2"/>
    <g fill="none" stroke="#75a69f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 178V308H530V178 M250 178V308 M390 178V308"/>
    </g>
    <path d="M320 308V424" fill="none" stroke="#c68d76" stroke-width="3"/>
    <text x="60" y="346" text-anchor="start" font-size="20" font-weight="700">Broadcom PEX88096</text>
    <text x="60" y="368" text-anchor="start" font-size="16" fill="#445b74">PCIe switch card</text>
    <g fill="#08655c" font-size="16" font-weight="600">
      <text x="462" y="343">GPU-to-GPU</text>
      <text x="462" y="365">direct traffic (P2P)</text>
    </g>

    <text x="338" y="407" text-anchor="start" font-size="17">Shared Gen4 x16 uplink</text>
    <rect x="130" y="424" width="380" height="78" rx="8" fill="#ffffff" stroke="#a6b8cb" stroke-width="2"/>
    <text x="320" y="451" font-size="22" font-weight="700">CPU root complex</text>
    <text x="320" y="475" font-size="17" fill="#445b74">Ryzen 9 7950X3D · AM5 motherboard</text>
    <text x="320" y="495" font-size="14" fill="#445b74">Top PCIe slot · root port 00:01.1</text>

      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M110 178V308H250V178" dur="8.42s" begin="0.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M390 178V308H530V178" dur="8.42s" begin="-1.70s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M110 178V308H390V178" dur="11.37s" begin="-3.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M250 178V308H530V178" dur="11.37s" begin="-5.10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M110 178V308H530V178" dur="14.32s" begin="-6.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#08786d" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M250 178V308H390V178" dur="8.42s" begin="-8.50s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
      <circle class="message" r="4.5" fill="#a74019" stroke="#fff" stroke-width="1.2">
        <animateMotion path="M320 424V308H530V178" dur="9.60s" begin="-2.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1"/>
      </circle>
    <g font-size="15" font-weight="600" text-anchor="start">
      <circle cx="55" cy="543" r="5" fill="#08786d"/>
      <text x="79" y="548" fill="#08655c">GPU-to-GPU direct traffic</text>
      <circle cx="380" cy="543" r="5" fill="#a74019"/>
      <text x="404" y="548" fill="#873411">CPU → GPU host traffic</text>
    </g>
  </g>
</svg>

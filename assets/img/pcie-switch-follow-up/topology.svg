<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" width="640" height="484" role="img" aria-labelledby="title desc">
  <title id="title">Four GPUs connected to an AM5 PCIe switch card with MCIO</title>
  <desc id="desc">Inside one chassis, a PEX88096 card plugs into the top motherboard slot at Gen4 x16. Four downstream links each use two eight-lane MCIO cables to a PCIe x16 slot adapter holding an RTX PRO 6000.</desc>
  <rect x="1" y="1" width="638" height="482" rx="16" fill="#f8fafc" stroke="#d3dce6" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172a41">
    <rect x="20" y="20" width="600" height="444" rx="12" fill="#edf5fb" stroke="#a6b8cb" stroke-width="2"/>
    <text x="38" y="47" text-anchor="start" font-size="17" fill="#445b74">Dual-chamber chassis</text>

    <g fill="#fff" stroke="#a6b8cb" stroke-width="2">
      <rect x="46" y="62" width="128" height="62" rx="7"/>
      <rect x="186" y="62" width="128" height="62" rx="7"/>
      <rect x="326" y="62" width="128" height="62" rx="7"/>
      <rect x="466" y="62" width="128" height="62" rx="7"/>
    </g>
    <g font-size="20" font-weight="700">
      <text x="110" y="89">GPU 0</text>
      <text x="250" y="89">GPU 1</text>
      <text x="390" y="89">GPU 2</text>
      <text x="530" y="89">GPU 3</text>
    </g>
    <g font-size="17" fill="#445b74">
      <text x="110" y="111">RTX PRO 6000</text>
      <text x="250" y="111">RTX PRO 6000</text>
      <text x="390" y="111">RTX PRO 6000</text>
      <text x="530" y="111">RTX PRO 6000</text>
    </g>
    <path d="M110 124v17m140-17v17m140-17v17m140-17v17" stroke="#226ca4" stroke-width="4"/>
    <g fill="#d8ebfa" stroke="#a6b8cb" stroke-width="2">
      <rect x="46" y="141" width="128" height="37" rx="7"/>
      <rect x="186" y="141" width="128" height="37" rx="7"/>
      <rect x="326" y="141" width="128" height="37" rx="7"/>
      <rect x="466" y="141" width="128" height="37" rx="7"/>
    </g>
    <g font-size="17">
      <text x="110" y="165">Slot adapter</text>
      <text x="250" y="165">Slot adapter</text>
      <text x="390" y="165">Slot adapter</text>
      <text x="530" y="165">Slot adapter</text>
    </g>

    <path d="M104 178v83m12-83v83m128-83v83m12-83v83m128-83v83m12-83v83m128-83v83m12-83v83"
          fill="none" stroke="#226ca4" stroke-width="3"/>
    <rect x="124" y="204" width="392" height="31" rx="6" fill="#edf5fb"/>
    <text x="320" y="225" font-size="18" font-weight="600">Each Gen4 x16 link uses two x8 MCIO cables</text>

    <rect x="42" y="261" width="556" height="54" rx="8" fill="#d8ebfa" stroke="#8bb7d8" stroke-width="2"/>
    <text x="320" y="295" font-size="23" font-weight="700">Broadcom PEX88096 switch card</text>

    <path d="M320 315v59" stroke="#226ca4" stroke-width="5"/>
    <text x="338" y="348" text-anchor="start" font-size="17">Gen4 x16 in top PCIe slot</text>
    <rect x="130" y="374" width="380" height="70" rx="8" fill="#ffffff" stroke="#a6b8cb" stroke-width="2"/>
    <text x="320" y="403" font-size="22" font-weight="700">AM5 motherboard</text>
    <text x="320" y="428" font-size="17" fill="#445b74">Ryzen 9 7950X3D · root port 00:01.1</text>
  </g>
</svg>
